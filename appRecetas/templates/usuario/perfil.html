{% extends 'base.html' %}
{% include 'meta.html' %}
{% block content %}
    


<h1>Perfil de {{ perfil.usuario.username }}</h1>
<div class="card" style="width: 18rem;">
    {% if perfil.avatar %}
    <div>
      <img src="{{ perfil.avatar.url}}" alt="Avatar" class="img-avatar card-img-top" alt="...">
    </div>
      
    {% else %}
    <p>No tienes un avatar cargado.</p>
{% endif %}
    <div class="card-body">
      <p><strong>Biografia:</strong> {{ perfil.bio }}</p>
      <p><strong>Email:</strong> {{ email }}</p>
      <a href="{% url 'editar_perfil' %}">Editar Perfil</a>
    </div>
  </div>



{% endblock %}
